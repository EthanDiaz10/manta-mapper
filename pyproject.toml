[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-mapper"
version = "0.1.0"
description = "Concept-design pipeline for a tailless blended-wing-body mapping UAV"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
aero = ["aerosandbox>=4.2", "neuralfoil>=0.3"]
dev = ["pytest>=7", "matplotlib>=3.7", "aerosandbox>=4.2", "neuralfoil>=0.3"]

[project.scripts]
manta-mapper = "manta_mapper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
